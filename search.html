<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    {% if movies %}

            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Director</th>
                        <th>Rating</th>
                        <th>Date</th>
                    </tr> 
                </thead>
                <tbody>

                    {% for movie in movies %}

                        <tr>
                            <td>{{ movie[0] }} </td>
                            <td>{{ movie[1] }}</td>
                            <td>{{ movie[2] }}</td>
                            <td>{{ movie[3] }}</td>
                            <td>{{ movie[4] }}</td>
                            <td>{{ movie[5] }}</td>
                            <td>{{ movie[6] }}</td>
                        </tr>

                    {% endfor %}
                </tbody>
            </table>

    {% elif query %}
    <p>No results found for "{{ query }}".</p>

    {% endif %}
    
</body>
</html>
